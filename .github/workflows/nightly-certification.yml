name: Weekly PWA certification

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skyjo-weekly-certification
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  certification:
    name: Weekly / Load & Recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out protected main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Resolve and build the exact weekly source
        run: |
          set -Eeuo pipefail
          source_sha="$(git rev-parse 'HEAD^{commit}')"
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          SKYJO_RELEASE_SHA="$source_sha"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$source_sha")"
          export SKYJO_RELEASE_SHA SOURCE_DATE_EPOCH
          echo "SKYJO_RELEASE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          npm run build
          npm run check:bundle
          node scripts/benchmark-ai.mjs
          npm run benchmark:ai:verify -- \
            --source-sha "$source_sha" \
            --release-version 0.3.4 \
            --strategy-version 1

      - name: Install pinned Chromium and k6
        run: |
          set -Eeuo pipefail
          npm exec -- playwright install --with-deps chromium
          sh scripts/install-k6.sh "$RUNNER_TEMP/skyjo-k6"
          echo "SKYJO_K6_BIN=$RUNNER_TEMP/skyjo-k6/k6" >> "$GITHUB_ENV"

      - name: Run weekly exact-topology certification
        run: npm run certify:automated

      - name: Upload checksummed sanitized weekly evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: weekly-certification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/certification
            test-results/ai
          if-no-files-found: error
          retention-days: 14
