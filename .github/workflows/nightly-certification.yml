name: Nightly PWA certification

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skyjo-nightly-certification
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  certification:
    name: Nightly / Load & Recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out protected main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Resolve and build the exact nightly source
        run: |
          set -Eeuo pipefail
          source_sha="$(git rev-parse 'HEAD^{commit}')"
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          echo "SKYJO_RELEASE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$source_sha")" >> "$GITHUB_ENV"
          npm run build
          npm run check:bundle

      - name: Install pinned Chromium and k6
        run: |
          set -Eeuo pipefail
          npm exec -- playwright install --with-deps chromium
          sh scripts/install-k6.sh "$RUNNER_TEMP/skyjo-k6"
          echo "SKYJO_K6_BIN=$RUNNER_TEMP/skyjo-k6/k6" >> "$GITHUB_ENV"

      - name: Run nightly exact-topology certification
        run: npm run certify:automated

      - name: Upload checksummed sanitized nightly evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: nightly-certification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/certification
          if-no-files-found: error
          retention-days: 14
