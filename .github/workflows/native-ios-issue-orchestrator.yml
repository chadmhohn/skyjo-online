name: Native iOS issue orchestrator

on:
  issues:
    types:
      - closed
      - reopened
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: skyjo-native-ios-issue-orchestrator
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  reconcile:
    name: iOS / Reconcile issue dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the protected default branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Reconcile blocked and agent-ready labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SKYJO_NATIVE_PROGRAM_ISSUE: "179"
        run: node scripts/reconcile-native-ios-issues.mjs
