name: Native iOS issue orchestrator

on:
  issues:
    types:
      - closed
      - reopened
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: skyjo-native-ios-issue-orchestrator
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  reconcile:
    name: iOS / Reconcile issue dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the protected default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Reconcile blocked and agent-ready labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SKYJO_NATIVE_PROGRAM_ISSUE: "179"
        run: node scripts/reconcile-native-ios-issues.mjs
