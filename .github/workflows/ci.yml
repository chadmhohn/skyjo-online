name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: CI / Quality & Security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate workflow schema with pinned actionlint
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          # GitHub supports concurrency.queue; actionlint v1.7.12 predates that schema addition.
          "$RUNNER_TEMP/actionlint" -ignore 'unexpected.key..queue.'

      - name: Validate operations shells and systemd units
        run: |
          set -Eeuo pipefail
          sh -n \
            deploy/bootstrap-skyjo-delivery.sh \
            deploy/github-release-remote.sh \
            deploy/install-skyjo-operations.sh \
            deploy/skyjo-canary-launch \
            deploy/skyjo-controller-launch \
            deploy/skyjo-delivery-bootstrap \
            deploy/skyjo-ops-launch \
            deploy/skyjo-release-controller \
            deploy/skyjo-smoke-launch \
            deploy/skyjo-state-proof-launch
          if ! getent passwd skyjo-monitor >/dev/null; then
            sudo useradd --system --user-group --home-dir /var/lib/skyjo-monitor --shell /usr/sbin/nologin skyjo-monitor
          fi
          sudo install -D -o root -g root -m 0555 /bin/true /opt/skyjo-online/node/bin/node
          sudo install -D -o root -g root -m 0555 /bin/true /usr/local/lib/skyjo-online/skyjo-ops-launch
          sudo systemd-tmpfiles --create "$GITHUB_WORKSPACE/deploy/skyjo-online-operations.tmpfiles"
          test "$(stat -c '%u:%g:%a:%h' /run/lock/skyjo-release-controller.lock)" = 0:0:600:1
          sudo install -d -o root -g root -m 0700 \
            /var/backups/skyjo-online /var/tmp/skyjo-restore-drills
          systemd-analyze verify \
            deploy/skyjo-backup-daily.service deploy/skyjo-backup-daily.timer \
            deploy/skyjo-backup-monthly.service deploy/skyjo-backup-monthly.timer \
            deploy/skyjo-readiness-monitor.service deploy/skyjo-readiness-monitor.timer

      - name: Resolve immutable source identity
        id: source
        run: |
          set -Eeuo pipefail
          source_sha="$(git rev-parse 'HEAD^{commit}')"
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            git fetch --no-tags origin main:refs/remotes/origin/main
            main_sha="$(git rev-parse 'refs/remotes/origin/main^{commit}')"
            [[ "$main_sha" =~ ^[a-f0-9]{40}$ ]]
            git merge-base --is-ancestor "$source_sha" "$main_sha"
            test "$(git merge-base "$source_sha" "$main_sha")" = "$source_sha"
          fi

          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "SKYJO_RELEASE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$source_sha")" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Validate native iOS issue orchestration logic
        run: node scripts/reconcile-native-ios-issues.mjs --self-test

      - name: Install audio inspection tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install locked dependencies
        run: npm ci

      - name: Quality, security, build, and bundle gates
        run: npm run test:quality

      - name: Existing release smoke coverage
        run: |
          node scripts/smoke-validation.mjs
          node scripts/smoke-ai.mjs
          node scripts/benchmark-ai.mjs
          node scripts/smoke-persistence.mjs
          node scripts/smoke-accounts.mjs
          node scripts/smoke-ops.mjs
          node scripts/smoke-backup.mjs
          npm run smoke:delivery
          node scripts/smoke-chat.mjs
          npm run smoke:invite-restart

      - name: Upload shared production build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: skyjo-build-${{ steps.source.outputs.sha }}
          path: |
            dist
            server-dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload deterministic AI calibration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ai-calibration-${{ steps.source.outputs.sha }}
          path: test-results/ai
          if-no-files-found: error
          retention-days: 14

      - name: Upload quality failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: quality-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/bundle
          if-no-files-found: ignore
          retention-days: 14

  ios-build:
    name: iOS / Build
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SKYJO_IOS_ARTIFACTS_DIR: ${{ github.workspace }}/ios/Artifacts
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build and test unsigned simulator app
        run: ./scripts/ios-build-test.sh

      - name: Upload sanitized iOS failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ios-build-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ios/Artifacts/*.log
            ios/Artifacts/*.xcresult
          if-no-files-found: error
          retention-days: 14

  unit-domain:
    name: CI / Unit (domain)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run deterministic release coverage tests
        run: npm run test:unit:release
      - name: Upload release coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: release-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/domain
            coverage/realtime
            coverage/ui
          if-no-files-found: ignore
          retention-days: 14

  unit-data:
    name: CI / Unit (data)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run isolated data tests
        run: npm run test:unit:data
      - name: Prove immutable v0.1.1 rollback compatibility
        run: npm run test:compat:v011
      - name: Upload data coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: data-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/data
          if-no-files-found: ignore
          retention-days: 14

  e2e-chromium-1:
    name: CI / E2E (chromium 1)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Download shared production build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: skyjo-build-${{ needs.quality.outputs.source-sha }}
          path: .

      - name: Install pinned Chromium
        run: npm exec -- playwright install --with-deps chromium
      - name: Run Chromium shard 1
        run: npm run test:e2e:chromium -- --shard=1/2
      - name: Upload Chromium shard 1 failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: chromium-1-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  e2e-chromium-2:
    name: CI / E2E (chromium 2)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Download shared production build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: skyjo-build-${{ needs.quality.outputs.source-sha }}
          path: .
      - name: Install pinned Chromium
        run: npm exec -- playwright install --with-deps chromium
      - name: Run Chromium shard 2
        run: npm run test:e2e:chromium -- --shard=2/2
      - name: Upload Chromium shard 2 failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: chromium-2-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  e2e-webkit:
    name: CI / E2E (webkit)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Download shared production build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: skyjo-build-${{ needs.quality.outputs.source-sha }}
          path: .
      - name: Install pinned WebKit
        run: npm exec -- playwright install --with-deps webkit
      - name: Run WebKit phone and tablet projects
        run: npm run test:e2e:webkit
      - name: Upload WebKit failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: webkit-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  visual-accessibility:
    name: CI / Visual & Accessibility
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Download shared production build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: skyjo-build-${{ needs.quality.outputs.source-sha }}
          path: .
      - name: Install pinned Chromium and WebKit
        run: npm exec -- playwright install --with-deps chromium webkit
      - name: Run serious and critical accessibility gate
        run: npm run test:a11y
      - name: Run canonical responsive visual gate
        run: npm run test:visual
      - name: Upload visual and accessibility failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: visual-a11y-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  lighthouse:
    name: CI / Lighthouse
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Download shared production build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: skyjo-build-${{ needs.quality.outputs.source-sha }}
          path: .
      - name: Install pinned Chromium
        run: npm exec -- playwright install --with-deps chromium
      - name: Run three-pass mobile Lighthouse gate
        run: npm run test:lighthouse
      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: lighthouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .lighthouseci
            test-results/lighthouse
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  load-recovery:
    name: CI / Load & Recovery
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact tested source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.quality.outputs.source-sha }}
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download shared production build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: skyjo-build-${{ needs.quality.outputs.source-sha }}
          path: .

      - name: Download exact-SHA AI calibration evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: ai-calibration-${{ needs.quality.outputs.source-sha }}
          path: test-results/ai

      - name: Verify exact-SHA AI calibration evidence
        run: |
          npm run benchmark:ai:verify -- \
            --source-sha "${{ needs.quality.outputs.source-sha }}" \
            --release-version 0.3.2 \
            --strategy-version 1

      - name: Install pinned Chromium and k6
        run: |
          set -Eeuo pipefail
          npm exec -- playwright install --with-deps chromium
          sh scripts/install-k6.sh "$RUNNER_TEMP/skyjo-k6"

      - name: Run exact-topology load, recovery, and persona certification
        env:
          SKYJO_K6_BIN: ${{ runner.temp }}/skyjo-k6/k6
          SKYJO_RELEASE_SHA: ${{ needs.quality.outputs.source-sha }}
        run: npm run certify:automated

      - name: Upload checksummed sanitized certification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: certification-${{ needs.quality.outputs.source-sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/certification
            test-results/ai
          if-no-files-found: error
          retention-days: 14

  runtime-artifact:
    name: CI / Runtime Artifact
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      source-sha: ${{ needs.quality.outputs.source-sha }}
      archive-name: ${{ steps.artifact.outputs.archive-name }}
    steps:
      - name: Check out exact tested source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.quality.outputs.source-sha }}
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked packaging dependencies
        run: npm ci

      - name: Download the one tested production build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: skyjo-build-${{ needs.quality.outputs.source-sha }}
          path: .

      - name: Package release-only runtime and CycloneDX SBOM
        id: artifact
        env:
          SKYJO_RELEASE_SHA: ${{ needs.quality.outputs.source-sha }}
        run: |
          set -Eeuo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct '${{ needs.quality.outputs.source-sha }}')"
          export SOURCE_DATE_EPOCH
          npm run release:artifact
          npm run test:artifact:integration
          echo "archive-name=skyjo-runtime-${{ needs.quality.outputs.source-sha }}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Verify archive allowlist, checksum, and release identity
        run: |
          npm run release:artifact:verify -- \
            --archive "release/${{ steps.artifact.outputs.archive-name }}" \
            --checksum "release/${{ steps.artifact.outputs.archive-name }}.sha256" \
            --release-sha "${{ needs.quality.outputs.source-sha }}"

      - name: Upload immutable release subjects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: skyjo-release-${{ needs.quality.outputs.source-sha }}
          path: release
          if-no-files-found: error
          retention-days: 14

  attest-runtime:
    name: CI / Runtime Attestation
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    needs:
      - runtime-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified release subjects
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: skyjo-release-${{ needs.runtime-artifact.outputs.source-sha }}
          path: release

      - name: Reverify exact subject set and checksum before signing
        run: |
          set -Eeuo pipefail
          sha="${{ needs.runtime-artifact.outputs.source-sha }}"
          archive="release/${{ needs.runtime-artifact.outputs.archive-name }}"
          checksum="$archive.sha256"
          sbom="release/skyjo-runtime-$sha.cdx.json"
          test "$(find release -mindepth 1 -maxdepth 1 -printf '%y %f\n' | LC_ALL=C sort)" = "$(printf 'f %s\n' \
            "$(basename "$archive")" \
            "$(basename "$checksum")" \
            "$(basename "$sbom")" | LC_ALL=C sort)"
          (cd release && sha256sum --check --strict "$(basename "$checksum")")
          test -s "$sbom"

      - name: Attest immutable runtime, checksum, and SBOM
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            release/${{ needs.runtime-artifact.outputs.archive-name }}
            release/${{ needs.runtime-artifact.outputs.archive-name }}.sha256
            release/skyjo-runtime-${{ needs.runtime-artifact.outputs.source-sha }}.cdx.json

      - name: Verify GitHub provenance before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for subject in \
            "release/${{ needs.runtime-artifact.outputs.archive-name }}" \
            "release/${{ needs.runtime-artifact.outputs.archive-name }}.sha256" \
            "release/skyjo-runtime-${{ needs.runtime-artifact.outputs.source-sha }}.cdx.json"; do
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --source-digest "${{ needs.runtime-artifact.outputs.source-sha }}" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          done

  release-canary:
    name: CI / Release Canary
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    needs:
      - runtime-artifact
      - attest-runtime
      - unit-domain
      - unit-data
      - e2e-chromium-1
      - e2e-chromium-2
      - e2e-webkit
      - visual-accessibility
      - lighthouse
      - load-recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: canary
    permissions:
      contents: read
      actions: read
      attestations: read
    concurrency:
      group: skyjo-production
      queue: max
    steps:
      - name: Check out tested deployment client
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.runtime-artifact.outputs.source-sha }}
          persist-credentials: false

      - name: Set up pinned Node 24 deployment client
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Download attested release subjects
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: skyjo-release-${{ needs.runtime-artifact.outputs.source-sha }}
          path: release

      - name: Reverify downloaded GitHub provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for subject in \
            "release/${{ needs.runtime-artifact.outputs.archive-name }}" \
            "release/${{ needs.runtime-artifact.outputs.archive-name }}.sha256" \
            "release/skyjo-runtime-${{ needs.runtime-artifact.outputs.source-sha }}.cdx.json"; do
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --source-digest "${{ needs.runtime-artifact.outputs.source-sha }}" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          done

      - name: Configure pinned deploy transport
        env:
          DEPLOY_KEY: ${{ secrets.SKYJO_DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SKYJO_DEPLOY_KNOWN_HOSTS }}
          AUTH_KEY: ${{ secrets.SKYJO_CANARY_AUTH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          test -n "$AUTH_KEY"
          install -d -m 0700 "$RUNNER_TEMP/skyjo-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/skyjo-ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/skyjo-ssh/known_hosts"
          printf '%s\n' "$AUTH_KEY" > "$RUNNER_TEMP/skyjo-ssh/canary-auth.pem"
          test -s "$RUNNER_TEMP/skyjo-ssh/id_ed25519"
          test -s "$RUNNER_TEMP/skyjo-ssh/known_hosts"
          test -s "$RUNNER_TEMP/skyjo-ssh/canary-auth.pem"

      - name: Upload and exercise isolated localhost canary
        env:
          SKYJO_DEPLOY_HOST: ${{ vars.SKYJO_DEPLOY_HOST }}
          SKYJO_DEPLOY_PORT: ${{ vars.SKYJO_DEPLOY_PORT || '22' }}
          SKYJO_DEPLOY_USER: ${{ vars.SKYJO_DEPLOY_USER || 'skyjo-deploy' }}
          SKYJO_DEPLOY_IDENTITY_FILE: ${{ runner.temp }}/skyjo-ssh/id_ed25519
          SKYJO_DEPLOY_KNOWN_HOSTS_FILE: ${{ runner.temp }}/skyjo-ssh/known_hosts
          SKYJO_DEPLOY_AUTH_PRIVATE_KEY_FILE: ${{ runner.temp }}/skyjo-ssh/canary-auth.pem
          SKYJO_DEPLOY_AUTH_KEY_ID: ${{ vars.SKYJO_DEPLOY_AUTH_KEY_ID }}
        run: |
          set -Eeuo pipefail
          run_id="${GITHUB_RUN_ID}-1-canary"
          sha="${{ needs.runtime-artifact.outputs.source-sha }}"
          archive="release/${{ needs.runtime-artifact.outputs.archive-name }}"
          checksum="$archive.sha256"
          deploy/github-release-remote.sh verify "$run_id" "$sha" "$archive" "$checksum"

      - name: Remove canary deployment credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/skyjo-ssh"

  production:
    name: CI / Production
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    needs:
      - runtime-artifact
      - attest-runtime
      - release-canary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.SKYJO_PUBLIC_BASE_URL }}
    permissions:
      contents: read
      actions: read
      attestations: read
    concurrency:
      group: skyjo-production
      queue: max
    steps:
      - name: Check out tested deployment client
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.runtime-artifact.outputs.source-sha }}
          persist-credentials: false

      - name: Set up pinned Node 24 deployment client
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Install locked production PWA smoke browser
        run: |
          set -Eeuo pipefail
          npm ci
          npm exec -- playwright install --with-deps chromium

      - name: Download the canary-proven release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: skyjo-release-${{ needs.runtime-artifact.outputs.source-sha }}
          path: release

      - name: Reverify downloaded GitHub provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for subject in \
            "release/${{ needs.runtime-artifact.outputs.archive-name }}" \
            "release/${{ needs.runtime-artifact.outputs.archive-name }}.sha256" \
            "release/skyjo-runtime-${{ needs.runtime-artifact.outputs.source-sha }}.cdx.json"; do
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --source-digest "${{ needs.runtime-artifact.outputs.source-sha }}" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          done

      - name: Configure pinned deploy transport
        env:
          DEPLOY_KEY: ${{ secrets.SKYJO_DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SKYJO_DEPLOY_KNOWN_HOSTS }}
          AUTH_KEY: ${{ secrets.SKYJO_PRODUCTION_AUTH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          test -n "$AUTH_KEY"
          install -d -m 0700 "$RUNNER_TEMP/skyjo-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/skyjo-ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/skyjo-ssh/known_hosts"
          printf '%s\n' "$AUTH_KEY" > "$RUNNER_TEMP/skyjo-ssh/production-auth.pem"
          test -s "$RUNNER_TEMP/skyjo-ssh/id_ed25519"
          test -s "$RUNNER_TEMP/skyjo-ssh/known_hosts"
          test -s "$RUNNER_TEMP/skyjo-ssh/production-auth.pem"

      - name: Promote tag and roll code back if the public edge fails
        env:
          SKYJO_DEPLOY_HOST: ${{ vars.SKYJO_DEPLOY_HOST }}
          SKYJO_DEPLOY_PORT: ${{ vars.SKYJO_DEPLOY_PORT || '22' }}
          SKYJO_DEPLOY_USER: ${{ vars.SKYJO_DEPLOY_USER || 'skyjo-deploy' }}
          SKYJO_DEPLOY_IDENTITY_FILE: ${{ runner.temp }}/skyjo-ssh/id_ed25519
          SKYJO_DEPLOY_KNOWN_HOSTS_FILE: ${{ runner.temp }}/skyjo-ssh/known_hosts
          SKYJO_PUBLIC_BASE_URL: ${{ vars.SKYJO_PUBLIC_BASE_URL }}
          SKYJO_DEPLOY_AUTH_PRIVATE_KEY_FILE: ${{ runner.temp }}/skyjo-ssh/production-auth.pem
          SKYJO_DEPLOY_AUTH_KEY_ID: ${{ vars.SKYJO_DEPLOY_AUTH_KEY_ID }}
        run: |
          set -Eeuo pipefail
          run_id="${GITHUB_RUN_ID}-1-production"
          sha="${{ needs.runtime-artifact.outputs.source-sha }}"
          archive="release/${{ needs.runtime-artifact.outputs.archive-name }}"
          checksum="$archive.sha256"
          [[ "$SKYJO_PUBLIC_BASE_URL" =~ ^https://[A-Za-z0-9.-]+/?$ ]]
          deploy/github-release-remote.sh promote "$run_id" "$sha" "$archive" "$checksum" "$GITHUB_REF_NAME"

          if ! node scripts/smoke-public-release.mjs --base-url "$SKYJO_PUBLIC_BASE_URL" --release-sha "$sha" || \
             ! env \
               -u SKYJO_DEPLOY_AUTH_PRIVATE_KEY_FILE \
               -u SKYJO_DEPLOY_IDENTITY_FILE \
               -u SKYJO_DEPLOY_KNOWN_HOSTS_FILE \
               -u SKYJO_DEPLOY_HOST \
               -u SKYJO_DEPLOY_PORT \
               -u SKYJO_DEPLOY_USER \
               -u SKYJO_DEPLOY_AUTH_KEY_ID \
               SKYJO_PUBLIC_PWA_BASE_URL="$SKYJO_PUBLIC_BASE_URL" \
               SKYJO_EXPECTED_RELEASE_SHA="$sha" \
               npm run smoke:public-pwa; then
            echo "Public release smoke failed; requesting code-only rollback." >&2
            rollback_result="$(deploy/github-release-remote.sh rollback "$run_id" "$sha" "$checksum" "$GITHUB_REF_NAME")"
            rollback_target="$(printf '%s' "$rollback_result" | node scripts/parse-code-rollback-result.mjs --failed-release-sha "$sha")"
            if [[ "$rollback_target" == legacy ]]; then
              node scripts/smoke-public-release.mjs --base-url "$SKYJO_PUBLIC_BASE_URL" --allow-legacy-rollback
            else
              node scripts/smoke-public-release.mjs --base-url "$SKYJO_PUBLIC_BASE_URL" --release-sha "$rollback_target"
            fi
            exit 1
          fi

      - name: Remove production deployment credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/skyjo-ssh"

  production-incident:
    name: Ops / Production deployment incident
    needs:
      - runtime-artifact
      - release-canary
      - production
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.runtime-artifact.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: skyjo-production-incident
      queue: max
      cancel-in-progress: false
    steps:
      - name: Check out immutable incident reconciler
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.runtime-artifact.outputs.source-sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Create sanitized deployment-failure evidence
        if: needs.production.result != 'success'
        run: |
          node --input-type=module <<'NODE'
          import { writeMonitorResult } from './scripts/readiness-monitor-lib.mjs';
          await writeMonitorResult(`${process.env.RUNNER_TEMP}/skyjo-readiness-result.json`, {
            formatVersion: 1,
            monitor: 'public',
            status: 'unhealthy',
            checkedAt: new Date().toISOString(),
            attempts: 1,
            failureClass: 'internal',
            httpStatus: null,
            releaseSha: null,
            schemaVersion: null,
            protocolVersion: null
          });
          NODE

      - name: Prove successful deployment recovery
        if: needs.production.result == 'success'
        env:
          SKYJO_PUBLIC_BASE_URL: ${{ vars.SKYJO_PUBLIC_BASE_URL }}
        run: |
          node scripts/monitor-readiness.mjs \
            --monitor public \
            --base-url "$SKYJO_PUBLIC_BASE_URL" \
            --attempts 3 \
            --timeout-ms 10000 \
            --output "$RUNNER_TEMP/skyjo-readiness-result.json"

      - name: Create or update the single sanitized incident
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SKYJO_INCIDENT_SOURCE: deployment
          SKYJO_MONITOR_RESULT: ${{ runner.temp }}/skyjo-readiness-result.json
        run: node scripts/reconcile-production-incident.mjs

      - name: Upload sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: production-deployment-incident-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skyjo-readiness-result.json
          if-no-files-found: error
          retention-days: 14
